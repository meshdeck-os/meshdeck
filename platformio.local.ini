; MeshDeck OS - custom standalone MeshCore firmware for LilyGo T-Deck
; This file is copied into the MeshCore checkout as platformio.local.ini
; (it is picked up automatically via extra_configs)

[env:MeshDeck_TDeck_868]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -UDISPLAY_CLASS
  -I examples/meshdeck
  -I examples/meshdeck/ui
  -D MESHDECK=1
  -D MESHDECK_VERSION='"1.0.0_260805a"'
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=32
  -D BLE_PIN_CODE=123456
  ; GPS support (external module on the T-Deck Grove/UART header). Compiled in
  ; but only polled when enabled in Settings -> GPS (default off, no module = no-op).
  -D ENV_INCLUDE_GPS=1
  ; Default: EU/UK (Narrow) community preset - 869.618 MHz, BW 62.5, SF8, CR8.
  ; This only applies on a fresh flash; the first-boot onboarding lets the user
  ; pick any regional preset (and it can be re-run from Settings).
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  -<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/meshdeck/*.cpp>
  +<../examples/meshdeck/ui/*.cpp>
  +<../examples/meshdeck/ui/*.c>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---------------------------------------------------------------------------
; Beta channel: identical to stable but with -D MESHDECK_BETA=1, which enables
; experimental features (e.g. the audio / voice proof-of-concept) gated behind
; #ifdef MESHDECK_BETA. Built and published alongside stable so testers can try
; risky features without touching the stable flasher.
;
; Codec2 (examples/meshdeck/codec2/) is LGPL-2.1 — see firmware/codec2/COPYING
; and THIRD_PARTY.md. Only the sources listed below are linked into beta builds.
; ---------------------------------------------------------------------------

[env:MeshDeck_TDeck_868_beta]
extends = env:MeshDeck_TDeck_868
board_build.arduino.loop_stack_size = 24576
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  -<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/meshdeck/*.cpp>
  +<../examples/meshdeck/ui/*.cpp>
  +<../examples/meshdeck/ui/*.c>
  ; Codec2 library only (no tools / tests)
  +<../examples/meshdeck/codec2/src/codebook/*.c>
  +<../examples/meshdeck/codec2/src/codec2.c>
  +<../examples/meshdeck/codec2/src/codec2_fft.c>
  +<../examples/meshdeck/codec2/src/codec2_fifo.c>
  +<../examples/meshdeck/codec2/src/codebook*.c>
  +<../examples/meshdeck/codec2/src/codebook/*.c>
  +<../examples/meshdeck/codec2/src/kiss_fft.c>
  +<../examples/meshdeck/codec2/src/kiss_fftr.c>
  +<../examples/meshdeck/codec2/src/lpc.c>
  +<../examples/meshdeck/codec2/src/nlp.c>
  +<../examples/meshdeck/codec2/src/pack.c>
  +<../examples/meshdeck/codec2/src/phase.c>
  +<../examples/meshdeck/codec2/src/postfilter.c>
  +<../examples/meshdeck/codec2/src/quantise.c>
  +<../examples/meshdeck/codec2/src/sine.c>
  +<../examples/meshdeck/codec2/src/interp.c>
  +<../examples/meshdeck/codec2/src/lsp.c>
  +<../examples/meshdeck/codec2/src/mbest.c>
  +<../examples/meshdeck/codec2/src/newamp1.c>
  +<../examples/meshdeck/codec2/src/newamp2.c>
  ; explicitly exclude everything else under codec2
  -<../examples/meshdeck/codec2/src/*test*.c>
  -<../examples/meshdeck/codec2/src/c2*.c>
  -<../examples/meshdeck/codec2/src/freedv_*.c>
  -<../examples/meshdeck/codec2/src/cohpsk_*.c>
  -<../examples/meshdeck/codec2/src/fdmdv_*.c>
  -<../examples/meshdeck/codec2/src/fm*.c>
  -<../examples/meshdeck/codec2/src/fsk_*.c>
  -<../examples/meshdeck/codec2/src/ldpc_*.c>
  -<../examples/meshdeck/codec2/src/ofdm_*.c>
build_flags =
  ${env:MeshDeck_TDeck_868.build_flags}
  -D MESHDECK_BETA=1
  -DCODEC2_MODE_1200_EN=1
  -DCODEC2_MODE_EN_DEFAULT=0
  -DCONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=1
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=24576
  -D ENV_INCLUDE_GPS=1
  -UGPS_BAUD_RATE
  -D GPS_BAUD_RATE=9600
  -I examples/meshdeck/codec2/src
  -I examples/meshdeck/codec2/src/codec2